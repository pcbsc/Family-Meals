<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Family Menu</title>
    <meta name="description" content="Our family's dishes, recipes and weekly meal plan." />
    <meta name="theme-color" content="#FF6B4A" />
    <!-- Only this app's own code runs; it only talks to itself and Claude. Photos can come from anywhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://api.anthropic.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com data:; frame-src https://www.youtube-nocookie.com https://www.tiktok.com https://www.instagram.com https://player.vimeo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="view">
      <div class="loading"><span class="pot">🍚</span><p>Getting the menu ready…</p></div>
    </main>
    <nav class="tabbar" aria-label="Main">
      <a href="#/today" data-tab="today"><span class="tab-emoji" aria-hidden="true">🏠</span><span>Today</span></a>
      <a href="#/week" data-tab="week"><span class="tab-emoji" aria-hidden="true">📅</span><span>Week</span></a>
      <a href="#/menu" data-tab="menu"><span class="tab-emoji" aria-hidden="true">📖</span><span>Menu</span></a>
      <a href="#/shop" data-tab="shop"><span class="tab-emoji" aria-hidden="true">🛒</span><span>Shop</span></a>
    </nav>
    <noscript>Family Menu needs JavaScript turned on.</noscript>
  </body>
</html>
